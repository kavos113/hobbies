[versions]
kotlin = "2.4.0"
kotlinx-coroutines = "1.11.0"
jackson = "3.2.2"
jackson-annotation = "2.22"
log4j = "2.26.1"
sqlite = "3.53.2.1"
flyway = "13.3.0"
openai = "4.50.0"
anthropic = "2.54.0"
shadow = "9.6.1"
protobuf = "4.35.1"
kotlinpoet = "2.3.0"
diff-utils = "4.17"
jgit = "7.7.1.202607240634-r"
ktreesitter = "0.25.1"
tree-sitter-java = "0.26.6"
tree-sitter-ts = "0.23.2"
graalvm = "25.2.4"

[libraries]
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
jackson-core = { group = "tools.jackson.core", name = "jackson-core", version.ref = "jackson" }
jackson-databind = { group = "tools.jackson.core", name = "jackson-databind", version.ref = "jackson" }
jackson-annotations = { group = "com.fasterxml.jackson.core", name = "jackson-annotations", version.ref = "jackson-annotation" }
jackson-module-kotlin = { group = "tools.jackson.module", name = "jackson-module-kotlin", version.ref = "jackson" }
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j" }
sqlite = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }
flyway-core = { group = "org.flywaydb", name = "flyway-core", version.ref = "flyway" }
openai = { group = "com.openai", name = "openai-java", version.ref = "openai" }
anthropic = { group = "com.anthropic", name = "anthropic-java", version.ref = "anthropic" }
protobuf = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "protobuf" }
kotlinpoet = { group = "com.squareup", name = "kotlinpoet", version.ref = "kotlinpoet" }
diffutils = { group = "io.github.java-diff-utils", name = "java-diff-utils", version.ref = "diff-utils" }
jgit = { group = "org.eclipse.jgit", name = "org.eclipse.jgit", version.ref = "jgit" }
ktreesitter = { group = "io.github.tree-sitter", name = "ktreesitter", version.ref = "ktreesitter" }
treesitter-java = { group = "io.github.bonede", name = "tree-sitter", version.ref = "tree-sitter-java" }
treesitter-ts = { group = "io.github.bonede", name = "tree-sitter-typescript", version.ref = "tree-sitter-ts" }
graalvm-js = { group = "org.graalvm.polyglot", name = "js", version.ref = "graalvm" }
graalvm-polyglot = { group = "org.graalvm.polyglot", name = "polyglot", version.ref = "graalvm" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }